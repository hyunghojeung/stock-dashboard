<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무관리 - 글쓰기</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Malgun Gothic', sans-serif; background: #f5f6fa; }
.header { background: #1e293b; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 18px; }
.header-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.header-right a { color: #94a3b8; text-decoration: none; }
.content { max-width: 1100px; margin: 20px auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 30px; }
.content h2 { font-size: 18px; color: #1e293b; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
.form-group { display: flex; flex-direction: column; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: 12px; color: #64748b; margin-bottom: 4px; font-weight: 600; }
.form-group input, .form-group select, .form-group textarea { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; font-family: inherit; }
.form-group textarea { min-height: 80px; resize: vertical; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #2563eb; }
.section-title { font-size: 14px; font-weight: 600; color: #1e293b; margin: 24px 0 12px; padding: 8px 0; border-bottom: 1px solid #e2e8f0; grid-column: 1 / -1; }
.attach-area { border: 2px dashed #d1d5db; border-radius: 6px; padding: 24px; text-align: center; color: #94a3b8; font-size: 13px; cursor: pointer; grid-column: 1 / -1; }
.attach-area:hover { border-color: #2563eb; color: #2563eb; }
.item-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
.item-table th { background: #f8fafc; padding: 8px 6px; border: 1px solid #e2e8f0; color: #475569; font-weight: 600; text-align: center; }
.item-table td { padding: 6px; border: 1px solid #e2e8f0; text-align: center; }
.item-table input { width: 100%; padding: 5px 4px; border: 1px solid #e5e7eb; border-radius: 3px; font-size: 12px; text-align: center; }
.item-table .input-right { text-align: right; }
.item-table-wrap { grid-column: 1 / -1; margin-top: 10px; }
.item-table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.item-table-header select { padding: 5px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; }
.btn-add-row { padding: 4px 12px; border: 1px solid #d1d5db; border-radius: 3px; background: #fff; font-size: 11px; cursor: pointer; color: #555; }
.total-row td { background: #f8fafc; font-weight: 700; }
.btn-area { grid-column: 1 / -1; display: flex; justify-content: center; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
.btn-save { padding: 10px 40px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
.btn-save:hover { background: #1d4ed8; }
.btn-cancel { padding: 10px 40px; background: #fff; color: #555; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; cursor: pointer; }
.btn-cancel:hover { background: #f5f6fa; }
.btn-delete { padding: 10px 40px; background: #dc2626; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
</style>
</head>
